<!DOCTYPE html>
<html>
<head>

    <title>Cab Booking Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <span class="navbar-brand">
            🚕 Cab Booking System
        </span>

        <a href="/auth/login" class="btn btn-danger">
            Logout
        </a>
        <a href="/ride/my-rides" class="btn btn-warning">
            My Rides
        </a>

    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4>Book A Ride</h4>

                </div>

                <div class="card-body">

                    <form id="rideForm">                    

                        <div class="mb-3">
                            <label>Pickup Location</label>
                            <input
                                type="text"
                                id="pickup"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label>Drop Location</label>
                            <input
                                type="text"
                                id="drop"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">

                            <label>Select Vehicle</label>

                            <select
                                id="choice"
                                class="form-control"
                            >
                                <option value="1">Mini - Rs 800</option>
                                <option value="2">Sedan - Rs 1500</option>
                                <option value="3">SUV - Rs 2500</option>
                            </select>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            Book Ride
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    Ride Information

                </div>

                <div class="card-body">

                    <div id="result">

                        No booking yet

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById("rideForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    let data = {

        pickup_location:
        document.getElementById("pickup").value,

        drop_location:
        document.getElementById("drop").value,

        choice:
        parseInt(
            document.getElementById("choice").value
        )
    };

    const response =
    await fetch("/ride/book", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)
    });

    const result =
    await response.json();

    document.getElementById("result").innerHTML = `

        <h5>Booking Successful</h5>

        <hr>

        <p>
        <strong>Invoice:</strong>
        ${result.data.invoice_id}
        </p>

        <p>
        <strong>Fare:</strong>
        Rs ${result.data.total_fare}
        </p>

        <p>
        <strong>Status:</strong>
        ${result.data.booking_status}
        </p>

        <p>
        <strong>Payment:</strong>
        ${result.data.payment_status}
        </p>
    `;
});

</script>

</body>
</html>
