<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow">
                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>

                    <form method="POST" action="/auth/signup-form">

                        <div class="mb-3">
                            <label>Full Name</label>
                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Username</label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>
                        </div>
                        
                        <div class="mb-3">
                            <label>Email</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Phone Number</label>                        
                            <input
                                type="text"
                                name="phone_number"
                                class="form-control"
                                required>
                        </div>                                               


                        <div class="mb-3">
                            <label>Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Signup
                        </button>

                    </form>

                    <hr>

                    <a href="/auth/login" class="btn btn-outline-secondary w-100">
                        Already Have Account?
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
