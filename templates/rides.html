<!DOCTYPE html>
<html>
<head>

<title>My Rides</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">
        My Rides
    </h1>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Invoice</th>
            <th>Name</th>
            <th>Pickup</th>
            <th>Drop</th>
            <th>Fare</th>
            <th>Booking</th>
            <th>Payment</th>

        </tr>

        </thead>

        <tbody>

        {% for ride in rides %}

        <tr>

            <td>{{ ride.id }}</td>

            <td>{{ ride.invoice_id }}</td>

            <td>{{ ride.customer_name }}</td>

            <td>{{ ride.pickup_location }}</td>

            <td>{{ ride.drop_location }}</td>

            <td>{{ ride.total_fare }}</td>

            <td>{{ ride.booking_status }}</td>

            <td>{{ ride.payment_status }}</td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
